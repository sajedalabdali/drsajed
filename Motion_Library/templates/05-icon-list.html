<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><title>قائمة بأيقونات</title>
<style>#ls{left:110px;width:860px}
#tt{font-size:76px;font-weight:800;text-align:center;margin-bottom:40px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.it{display:flex;align-items:center;gap:28px;height:132px;margin-bottom:22px;padding:0 34px;border-radius:30px;background:rgba(14,14,14,.92);border:2px solid #262626;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.it .ib{width:84px;height:84px;border-radius:24px;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 14%,transparent);border:2px solid var(--accent)}
.it .tx{font-size:50px;font-weight:700;white-space:nowrap}</style></head>
<body>
<div id="ls" class="a ar"><div id="tt"></div><div id="its"></div></div>
<script>
window.TPL = {duration:4.5, defaults:{title:'العنوان', items:[{icon:'check',text:'العنصر الأول'},{icon:'check',text:'العنصر الثاني'},{icon:'check',text:'العنصر الثالث'}], y:560, gap:.45},
 build(D){const ICONS={"check": "<path d=\"M5 12.5l4.5 4.5L19 7.5\"/>", "star": "<path d=\"M12 2.8l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 17l-5.8 3.3 1.4-6.4L2.7 9.5l6.5-.7z\"/>", "bolt": "<path d=\"M13 2L4 14h7l-1 8 9-12h-7z\"/>", "heart": "<path d=\"M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z\"/>", "play": "<path d=\"M8 5l11 7-11 7z\"/>", "folder": "<path d=\"M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>", "chat": "<path d=\"M4 5h16v11H9l-5 4z\"/>", "lock": "<rect x=\"5\" y=\"10\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"/>", "gift": "<rect x=\"3\" y=\"8\" width=\"18\" height=\"4\"/><path d=\"M5 12v9h14v-9M12 8v13M12 8S10 3 7.5 4.5 9 8 12 8zm0 0s2-5 4.5-3.5S15 8 12 8z\"/>", "film": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4\"/>", "type": "<path d=\"M4 7V5h16v2M9 19h6M12 5v14\"/>", "music": "<path d=\"M9 18V5l12-2v13\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><circle cx=\"18\" cy=\"16\" r=\"3\"/>", "spark": "<path d=\"M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6\"/>", "x": "<path d=\"M6 6l12 12M18 6 6 18\"/>", "download": "<path d=\"M12 4v11M7 10l5 5 5-5M5 20h14\"/>"};const ic=(n,s=56,c="var(--accent)")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||ICONS.check}</svg>`;window._ic=ic;const $=ML.$;$('ls').style.top=D.y+'px';$('tt').innerHTML=ML.rich(D.title||'');
  $('its').innerHTML=D.items.map((it,i)=>`<div class="it" id="it${i}"><div class="ib">${ic(it.icon)}</div><div class="tx">${ML.rich(it.text)}</div></div>`).join('');},
 draw(t,D){const $=ML.$,e=ML.dur;ML.riseIn($('tt'),t,0,e);const o=ML.eio(ML.P(t,e-.4,e));
  D.items.forEach((it,i)=>{const T=.45+i*D.gap,k=ML.ex(ML.P(t,T,T+.45));const el=$('it'+i);ML.vis(el,Math.min(k,1-o),`translateX(${ML.L(-90,0,k)}px) scale(${ML.L(.94,1,k)})`);
   const g=Math.sin(Math.PI*ML.P(t,T+.1,T+.7));el.style.borderColor=g>.05?`color-mix(in srgb,var(--accent) ${Math.round(30+60*g)}%,#262626)`:'#262626';
   el.querySelector('.ib').style.transform=`scale(${ML.cl(ML.back(ML.P(t,T+.15,T+.5)),0,1.3)})`;});}};
</script>
<script src="_core.js"></script>
</body></html>
