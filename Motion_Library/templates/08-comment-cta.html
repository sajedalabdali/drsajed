<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><title>اكتب كلمة بالتعليقات</title>
<style>#cm{left:90px;width:900px;height:330px}
#post{right:30px;left:30px;top:34px;display:flex;gap:20px;align-items:flex-start}
.av{width:70px;height:70px;border-radius:50%;flex:none;background:conic-gradient(#fff,var(--accent),#fff);padding:4px}.av i{display:block;width:100%;height:100%;border-radius:50%;background:#1b1b1b}
#bx{right:30px;left:30px;bottom:32px;height:92px;border-radius:46px;border:2px solid #262a33;display:flex;align-items:center;padding:0 14px 0 30px;gap:18px}
#ph{flex:1;font-size:38px;color:#777}#snd{width:66px;height:66px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
#ht{margin-right:auto;font-size:44px}
#dm{left:110px;width:860px;height:150px;display:flex;align-items:center;gap:24px;padding:0 30px;font-size:42px;font-weight:700}
#dm .pi{width:84px;height:84px;border-radius:24px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
#hand{left:0;top:0;width:100px;height:100px;z-index:9}</style></head>
<body>
<div id="cm" class="a glass ar"><div id="post" class="a"><div class="av"><i></i></div><div><div class="mono" style="font-size:21px;color:#777;direction:ltr;text-align:right">@you · now</div><div id="kw" style="font-size:54px;font-weight:800"></div></div><div id="ht">♥</div></div>
<div id="bx" class="a"><div class="av" style="width:58px;height:58px"><i></i></div><div id="ph"></div><div id="snd"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.8" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div></div></div>
<div id="dm" class="a glass ar"><div class="pi"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></div><span id="st"></span></div>
<svg id="hand" class="a" viewBox="0 0 24 24"><path d="M9 11.5V4.8a1.6 1.6 0 0 1 3.2 0v5.4l.1-1.3a1.6 1.6 0 0 1 3.2.2v1.3a1.6 1.6 0 0 1 3.1.4v1a1.6 1.6 0 0 1 3 .6v4.1c0 3.3-2.6 6-5.9 6h-2.2a6 6 0 0 1-4.6-2.2l-3.6-4.4a1.7 1.7 0 0 1 2.5-2.3L9 15z" fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/></svg>
<script>
window.TPL = {duration:4, defaults:{keyword:'كلمة', placeholder:'أضف تعليقاً…', sent:'أرسلت لك ✓', y:1180},
 build(D){const $=ML.$;$('cm').style.top=D.y+'px';$('dm').style.top=(D.y+360)+'px';$('kw').textContent=D.keyword;$('st').textContent=D.sent;},
 draw(t,D){const $=ML.$,e=ML.dur,o=ML.eio(ML.P(t,e-.35,e+.1));const k=ML.eio(ML.P(t,0,.45));ML.vis($('cm'),k*(1-o),`translateY(${ML.L(90,0,k)-o*60}px) scale(${ML.L(.94,1,k)})`);
  const T1=.6,T2=T1+Math.max(.35,[...D.keyword].length*.11);const ty=t>=T1&&t<T2+.05;const K=[...D.keyword];
  $('ph').textContent=ty?K.slice(0,Math.min(K.length,1+Math.floor((t-T1)/(T2-T1)*K.length))).join(''):D.placeholder;$('ph').style.color=ty?'#fff':'#777';
  const po=ML.ex(ML.P(t,T2+.05,T2+.4));ML.vis($('post'),po,`translateY(${ML.L(30,0,po)}px)`);$('snd').style.transform=`scale(${t>T2-.12&&t<T2+.05?.85:1})`;
  $('ht').style.transform=`scale(${ML.back(ML.P(t,T2+.25,T2+.55))})`;$('ht').style.color=t>T2+.35?D.accent:'#fff';
  const d=ML.eio(ML.P(t,T2+.7,T2+1.0));ML.vis($('dm'),t>T2+.7?d*(1-o):0,`translateY(${ML.L(50,0,d)-o*60}px) scale(${ML.L(.95,1,d)})`);
  const h1=ML.eo(ML.P(t,.3,.7)),h2=ML.eio(ML.P(t,T2+.1,T2+.5));const hx=ML.L(ML.L(980,945,h1),1000,h2),hy=ML.L(ML.L(D.y+520,D.y+280,h1),D.y+540,h2);
  ML.vis($('hand'),t>.3&&t<T2+.5?Math.min(ML.eo(ML.P(t,.3,.5)),1-h2):0,`translate(${hx-30}px,${hy-10}px) scale(${t>T2-.12&&t<T2+.02?.9:1}) rotate(-14deg)`);}};
</script>
<script src="_core.js"></script>
</body></html>
