<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><title>ترجمة كلمة بكلمة</title>
<style>#cap{left:60px;width:960px;text-align:center;font-size:var(--sz,84px);font-weight:800;line-height:1.3;text-shadow:0 4px 24px rgba(0,0,0,.85),0 0 2px #000}
#cap span{display:inline-block;margin:0 .12em;transition:none}</style></head>
<body>
<div id="cap" class="a ar"></div>
<script>
window.TPL = {duration:5, defaults:{text:'', words:null, perLine:3, y:1320, size:84},
 build(D){const c=ML.$('cap');c.style.top=D.y+'px';c.style.setProperty('--sz',D.size+'px');
  let W=D.words;if(!W||!W.length){const ws=(D.text||'').split(/\s+/).filter(Boolean),dur=(D.duration||ML.dur)-.2,tot=ws.reduce((s,w)=>s+w.length+2,0);let t=.1;W=ws.map(w=>{const d=dur*(w.length+2)/tot,o={w,start:t,end:t+d};t+=d;return o;});}
  window._W=W;window._G=[];for(let i=0;i<W.length;i+=D.perLine)window._G.push(W.slice(i,i+D.perLine));if(!D.duration)ML.dur=W[W.length-1].end+.3;},
 draw(t,D){const c=ML.$('cap'),G=window._G;let g=G.findIndex(gr=>t<gr[gr.length-1].end+.05);if(g<0)g=G.length-1;const gr=G[g];
  if(c.dataset.g!=g){c.dataset.g=g;c.innerHTML=gr.map(w=>`<span>${ML.esc(w.w)}</span>`).join(' ');}
  const sp=[...c.children];const gs=gr[0].start;const k=ML.e4(ML.P(t,gs-.05,gs+.2));c.style.opacity=t<gs-.05?0:k*(1-ML.P(t,ML.dur-.15,ML.dur));c.style.transform=`translateY(${ML.L(20,0,k)}px)`;
  gr.forEach((w,i)=>{const on=t>=w.start&&t<w.end+.02,p=ML.eo(ML.P(t,w.start,w.start+.12));sp[i].style.color=t>=w.start?(on?D.accent:'var(--fg)'):'rgba(255,255,255,.55)';sp[i].style.transform=`scale(${on?ML.L(1,1.08,p):1})`;});}};
</script>
<script src="_core.js"></script>
</body></html>
